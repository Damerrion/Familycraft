# FamilyCraft - family system for KingdomCraft

settings:
  # Maximum length of the family name (no digits allowed)
  max-name-length: 30
  # Maximum length of the family tag (no digits allowed)
  max-tag-length: 3
  # Seconds an invite stays valid
  invite-expire-seconds: 60
  # Seconds you have to confirm /family disband
  disband-confirm-seconds: 15
  # Maximum members per family (0 = unlimited)
  max-members: 0

economy:
  # One-time price for creating a family (needs Vault + an economy plugin).
  # 0 = free. Players with family.admin never pay.
  create-cost: 0.0

# Placeholders for the KingdomCraft chat.yml / scoreboards (use them like {family_prefix}):
#   {family_tag}     -> RD
#   {family_prefix}  -> the `prefix-format` below with the tag filled in, empty without family
#   {family_name}    -> Rheanos Decendants
placeholders:
  prefix-format: '&7[&f%tag%&7]'

# KingdomCraft sets the display name to '<kingdom prefix> <name><kingdom suffix>' itself, so chat plugins
# that show the display name (EssentialsChat, ...) never see the family. FamilyCraft rebuilds it with this
# format. Any KingdomCraft placeholder works; %player% is the player name. Disable if you do not want this.
display-name:
  enabled: true
  format: '{kingdom_prefix} {family_prefix} %player%{kingdom_suffix}'

