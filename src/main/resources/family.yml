# Effecten bij de grote momenten: titels (messages.title-*/subtitle-*), geluiden en deeltjes.
# Geluid = Minecraft-key (ook resourcepack-geluiden), meerdere met komma's, leeg = stil.
# announce-* = bericht aan de hele server (messages.announce-*).
effects:
  enabled: true
  particles: true
  announce-created: true
  announce-wedding: true
  sounds:
    gui-open: 'minecraft:item.book.page_turn'
    created: 'minecraft:ui.toast.challenge_complete, minecraft:item.goat_horn.sound.0'
    joined: 'minecraft:entity.player.levelup'
    rank: 'minecraft:block.note_block.bell'
    new-head: 'minecraft:item.goat_horn.sound.0'
    engaged: 'minecraft:block.amethyst_block.chime'
    wedding: 'minecraft:block.bell.use, minecraft:entity.firework_rocket.twinkle'
    crest: 'minecraft:item.armor.equip_netherite'
    disbanded: 'minecraft:block.beacon.deactivate'

# KingdomCraft sets the display name to '<kingdom prefix> <name><kingdom suffix>' itself, so chat plugins
# that show the display name (EssentialsChat, ...) never see the family. FamilyCraft rebuilds it with this
# format. Any KingdomCraft placeholder works; %player% is the player name. Disable if you do not want this.
display-name:
  enabled: true
  format: '{kingdom_prefix} {family_prefix} %player%{kingdom_suffix}'

