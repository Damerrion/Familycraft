# FenixCore - family-module (voorheen FamilyCraft)

settings:
  # Maximum length of the family name (no digits allowed)
  max-name-length: 30
  # Maximum length of the family tag (no digits allowed)
  max-tag-length: 3
  # Seconds an invite stays valid
  invite-expire-seconds: 60
  # Seconds you have to confirm /family disband
  disband-confirm-seconds: 15
  # Maximum members per family (0 = unlimited)
  max-members: 0

economy:
  # One-time price for creating a family (needs Vault + an economy plugin).
  # 0 = free. Players with family.admin never pay.
  create-cost: 0.0

# Placeholders for the KingdomCraft chat.yml / scoreboards (use them like {family_prefix}):
#   {family_tag}     -> RD
#   {family_prefix}  -> the `prefix-format` below with the tag filled in, completely empty without family
#                       (brackets and the trailing space included, so use '{kingdom_prefix} {family_prefix}{username}')
#   {family_name}    -> Rheanos Decendants
placeholders:
  prefix-format: '&7[&f%tag%&7] '

# Hovering over {family_prefix} in the KingdomCraft chat shows these lines, clicking it runs click-command.
# Only works for {family_prefix} (not {family_tag}). Variables: %name% %tag% %kingdom% %date% %owner% %members%
chat-hover:
  enabled: true
  lines:
    - '&5&m                              '
    - '&6Volledige naam: &7%name%'
    - '&6Afgekorte naam: &7%tag%'
    - '&6Familie afstamming: &7%kingdom%'
    - '&6Datum opgericht: &7%date%'
    - '&6Eigenaar: &7%owner% &8(&7%members% leden&8)'
    - '&5&m                              '
  # empty = nothing happens on click
  click-command: '/family members %tag%'

# Rangen (hiërarchie). name = weergave, max = hoeveel leden die rang mogen hebben (0 = onbeperkt).
# Het familiehoofd is er altijd precies één. Geven: /family rank give <speler|UUID> <rang> of via /family editor.
# In het commando: familiehoofd, opvolger, reserve-erfgenaam, gemaal, gemaal-van-de-erfgenaam, kind-van-het-huis.
# (de sleutels hieronder blijven Engels, zodat bestaande families.yml blijft werken)
ranks:
  family-head:
    name: 'Familiehoofd'
  successor:
    name: 'Opvolger'
    max: 1
  spare-heir:
    name: 'Reserve-erfgenaam'
    max: 1
  consort:
    name: 'Gemaal'
    max: 0
  heirs-consort:
    name: 'Gemaal van de Erfgenaam'
    max: 0
  children-of-the-house:
    name: 'Kind van het Huis'
    max: 0

# Huwelijk: /enlope <speler> (verloving, de ander klikt [Ja]). In het trouwmenu (/family marriage) stelt het paar in
# wie bruidegom/bruid is en wie (A) kiest; het hoofd van de familie van de bruid start de trouwerij.
#  - hoofd + hoofd: de families fuseren tot "Dokker Lijn" + "Adamantie Lijn" -> "Dokker-Adamantie Lijn" [DAL]
#  - hoofd + Opvolger: de Opvolger gaat over naar de familie van het hoofd (Reserve-erfgenaam schuift door)
#  - anders kiest A: lijn A gaat op in lijn B / alleen A gaat over / samen nieuwe lijn C / aftakking "A-B"
#    (hele lijn meenemen kan alleen het hoofd of de Opvolger van lijn A)
# Vanaf zoveel families in de naam (A-B-C-D) moet het hoofd een nieuwe naam en tag kiezen.
# proposal-expire-minutes = hoe lang een /enlope-aanzoek openstaat.
marriage:
  proposal-expire-minutes: 30
  rename-at-families: 4

